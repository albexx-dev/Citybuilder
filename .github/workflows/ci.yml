name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    name: Static validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate repository
        run: python Tools/ValidateRepo.py

  # Optional: Unity tests need a license secret. `secrets` is not available in a
  # job-level `if`, so gate on a repository variable instead. Enable by setting
  # Actions variable ENABLE_UNITY_TESTS=true together with UNITY_LICENSE /
  # UNITY_EMAIL / UNITY_PASSWORD secrets.
  unity-editmode:
    name: Unity EditMode tests
    runs-on: ubuntu-latest
    needs: validate
    if: ${{ vars.ENABLE_UNITY_TESTS == 'true' }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: game-ci/unity-test-runner@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: .
          unityVersion: 6000.3.25f1
          testMode: EditMode
          artifactsPath: TestResults
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TestResults
          path: TestResults
